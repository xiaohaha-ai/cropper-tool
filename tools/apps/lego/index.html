<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f2ed"><title>积木工坊 · 拼搭工作台</title></head>
<body>
<header class="app-header"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>积木工坊<span class="brand-sub">PART LIBRARY</span></span></div><div class="header-path">零件库 <span>/</span> 为你的下一件作品准备</div><button id="manifest" class="quiet-button">下载零件目录 <span aria-hidden="true">↗</span></button></header>
<div class="workspace">
  <aside class="sidebar" aria-label="零件分类"><div class="section-label">浏览零件</div><nav id="categories" aria-label="分类筛选"></nav><div class="sidebar-foot"><span class="scale-icon">↔</span><strong>统一尺寸体系</strong><p>8 mm 凸点间距<br>3.2 mm 薄板高度<br>9.6 mm 标准砖高度</p><span class="stage-label">第一阶段 · 零件准备</span></div></aside>
  <main class="catalogue"><div class="catalogue-head"><div class="eyebrow">THE BUILDING BLOCKS</div><div class="headline"><h1>从一块开始。</h1><span id="total-badge"></span></div><p class="intro">挑一块零件，转一转，看看它能成为些什么。</p><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索名称、规格，例如 2x4、齿轮" aria-label="搜索零件"><kbd>/</kbd></label><div class="results-bar"><h2 id="category-title">全部零件</h2><span id="result-count" role="status"></span></div></div><div id="parts-grid" class="parts-grid" role="list" aria-label="零件列表"></div><div id="empty" class="empty" hidden><span>没有找到这块零件</span><p>试试“薄板”“轴”或“2x4”。</p><button id="clear-search">清除筛选</button></div></main>
  <aside class="inspector" aria-label="选中零件详情"><div class="inspect-heading"><span class="eyebrow">零件预览</span><span id="part-category"></span></div><div class="preview-wrap"><div id="scene" aria-label="三维零件预览"></div><span class="preview-corner">3D / ORBIT</span><button id="reset" class="reset-button" title="复位视角" aria-label="复位视角">↺</button><span id="view-hint" class="view-hint">拖动旋转 · 滚轮缩放</span></div><div class="inspector-content"><div class="part-title"><h2 id="part-name"></h2><span id="part-id"></span></div><div id="palette" class="palette" role="group" aria-label="零件颜色"></div><div class="view-actions"><button id="bottom" aria-pressed="false">查看底部</button><button id="connections" aria-pressed="false">连接点</button><button id="rotate" aria-pressed="false">自动旋转</button></div><div id="legend" class="legend" hidden><span><i class="dot stud"></i>凸点</span><span><i class="dot socket"></i>底部接口</span><span><i class="dot mechanical"></i>机械接口</span></div><dl class="specs"><div><dt>实际外廓</dt><dd id="part-dimensions"></dd></div><div><dt>连接点</dt><dd id="part-connections"></dd></div><div><dt>适合用来</dt><dd id="part-purpose"></dd></div></dl><p id="part-note" class="part-note"></p><button id="download" class="download-button">下载此零件 <span>GLB ↗</span></button><p id="status" class="status" role="status">正在准备零件…</p></div></aside>
</div>
<script type="module" src="/src/entry.ts"></script>
</body></html>
