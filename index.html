<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#171717" />
  <meta name="description" content="裁切、去水印、免费字体库、乐高拼图与秀米排版，选择工具即可开始使用。" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script>
    try {
      const savedTheme = localStorage.getItem('image-cropper-theme');
      document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <title>工具首页 - 裁切台</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
  <script src="vendor/lucide.min.js" defer></script>
  <script src="home.js" defer></script>
</head>
<body class="home-page">
  <header class="topbar">
    <a class="brand" href="./" aria-label="裁切台主页"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span><span>裁切台</span></a>
    <button class="theme-toggle" id="homeThemeToggle" type="button" aria-label="切换主题" title="切换主题"><i class="theme-icon theme-icon--sun" data-lucide="sun" aria-hidden="true"></i><i class="theme-icon theme-icon--moon" data-lucide="moon" aria-hidden="true"></i></button>
  </header>
  <main class="home-main">
    <h1>选择一个工具</h1>
    <nav class="tool-grid" aria-label="工具入口">
      <a class="tool-card" href="cropper.html" aria-labelledby="cropperTitle" aria-describedby="cropperDescription">
        <i class="tool-icon" data-lucide="crop" aria-hidden="true"></i>
        <div class="tool-copy"><h2 id="cropperTitle">裁切</h2><p id="cropperDescription">调整尺寸与比例，裁出需要的画面。</p></div>
        <span class="tool-enter" aria-hidden="true">进入工具<i data-lucide="arrow-up-right"></i></span>
      </a>
      <a class="tool-card" href="watermark.html" aria-labelledby="watermarkTitle" aria-describedby="watermarkDescription">
        <i class="tool-icon" data-lucide="eraser" aria-hidden="true"></i>
        <div class="tool-copy"><h2 id="watermarkTitle">去水印</h2><p id="watermarkDescription">涂抹需要处理的区域，修复图片。</p></div>
        <span class="tool-enter" aria-hidden="true">进入工具<i data-lucide="arrow-up-right"></i></span>
      </a>
      <a class="tool-card" href="fonts.html" aria-labelledby="fontsTitle" aria-describedby="fontsDescription">
        <i class="tool-icon" data-lucide="type" aria-hidden="true"></i>
        <div class="tool-copy"><h2 id="fontsTitle">免费字体库</h2><p id="fontsDescription">输入中英文，找到合适的字体。</p></div>
        <span class="tool-enter" aria-hidden="true">进入工具<i data-lucide="arrow-up-right"></i></span>
      </a>
      <a class="tool-card" href="lego/" aria-labelledby="legoTitle" aria-describedby="legoDescription">
        <i class="tool-icon" data-lucide="blocks" aria-hidden="true"></i>
        <div class="tool-copy"><h2 id="legoTitle">乐高拼图</h2><p id="legoDescription">挑选积木，自由拼搭或跟随模型创作。</p></div>
        <span class="tool-enter" aria-hidden="true">进入工具<i data-lucide="arrow-up-right"></i></span>
      </a>
      <a class="tool-card" href="layout/" aria-labelledby="layoutTitle" aria-describedby="layoutDescription">
        <i class="tool-icon" data-lucide="panels-top-left" aria-hidden="true"></i>
        <div class="tool-copy"><h2 id="layoutTitle">秀米排版</h2><p id="layoutDescription">编辑图文、管理素材，导出你的作品。</p></div>
        <span class="tool-enter" aria-hidden="true">进入工具<i data-lucide="arrow-up-right"></i></span>
      </a>
    </nav>
  </main>
</body>
</html>
